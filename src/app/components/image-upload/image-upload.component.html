<div class="upload-container" 
     [class.dragging]="isDragging"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)">
  
  <div *ngIf="!selectedFile; else previewState" class="upload-prompt">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </div>
    <h3>Drag and drop an image here</h3>
    <p>or</p>
    <label class="file-label" tabindex="0" (keydown.enter)="fileInput.click()">
      Browse Files
      <input #fileInput type="file" (change)="onFileSelected($event)" accept=".png, .jpg, .jpeg, .bmp, .tiff" class="file-input" aria-label="Upload microscopic image file"/>
    </label>
    <p class="help-text">Supports PNG, JPG, BMP, TIFF</p>
  </div>

  <ng-template #previewState>
    <div class="preview-container">
      <div class="image-wrapper">
        <img [src]="imagePreview" alt="Selected cellular image" class="preview-img" />
      </div>
      <div class="file-details">
        <p class="filename">{{ selectedFile?.name }}</p>
        <p class="filesize">{{ (selectedFile?.size || 0) / 1024 | number:'1.2-2' }} KB</p>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" (click)="removeImage()" [disabled]="isLoading">Change Image</button>
        <button class="btn btn-primary" (click)="analyzeImage()" [disabled]="isLoading">
          <span *ngIf="!isLoading">Analyze Image</span>
          <span *ngIf="isLoading" class="loader"></span>
        </button>
      </div>
    </div>
  </ng-template>
</div>
